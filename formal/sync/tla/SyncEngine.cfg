\* Clean run: the invariants that HOLD on the current code (depth 4, every
\* actor enabled). Every other invariant has a genuine counterexample -- see
\* run_all.sh and ../README.md. I7 is re-checked with InitNeverFetched = TRUE
\* in run_all.sh (it is vacuous from this initial state).
CONSTANTS
    MaxSteps = 4
    NV = 3
    InitNeverFetched = FALSE
    MaxScaffolds = 1
    EnableAbort = TRUE
    EnableRemote = TRUE
    EnableIgnore = TRUE
    EnableDev = TRUE
SPECIFICATION Spec
CONSTRAINT StepBound
INVARIANTS
    TypeOK
    I3_IgnoredUntouched
    I4_BranchIsolation
    I7_NeverFetchedNotDeleted
