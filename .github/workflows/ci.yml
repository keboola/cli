name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per PR. Pushing again to an open PR supersedes the previous
# run, which used to keep burning a full ~39 billed minutes (a Windows job bills
# 2x) on a commit nobody would ever look at again. Measured over 13 days: 29 of
# 219 PR runs (13%) were still executing when the next push landed, and a single
# iterating branch racked up 23 runs.
#
# `cancel-in-progress` is deliberately PR-ONLY. A push to main is the
# post-merge verification of a commit that is already shipped -- cancelling it
# because the next merge arrived would silently drop the signal for the commit
# in between, which is exactly when you want it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Static analysis + silent-drift gates. These are deterministic and
  # interpreter-independent, so they run ONCE on the baseline interpreter
  # rather than across the test matrix. This job is the CI mirror of the
  # non-test half of `make check` (lint, format, ty, skill, version,
  # version-gates, command-sync, error-codes).
  #
  # `changelog-check` is deliberately NOT here: it shells out to `gh release
  # list` (GitHub auth + network) and audits whether published GitHub
  # *releases* have changelog entries -- a release-time concern, not a per-PR
  # one. It stays in local `make check`.
  # ────────────────────────────────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          # Pin an exact version so setup-uv downloads the release asset
          # directly instead of fetching the `uv.ndjson` version manifest from
          # raw.githubusercontent.com on every run -- that fetch is rate-limited
          # and flaky on shared CI egress IPs (it killed the Windows job once).
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # `--extra server` pulls in fastapi/uvicorn/sse-starlette/python-multipart/
        # croniter so the test suite can import `keboola_agent_cli.server.*`.
        run: uv sync --extra server

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Format check
        run: uv run ruff format . --check

      - name: Type check (ty)
        # Static type checker (Astral `ty`). Fails the build on any `error[...]`;
        # the downgraded `unresolved-import` warning (see [tool.ty.rules] in
        # pyproject.toml) does NOT block. Previously `ty` ran ONLY in the local
        # pre-commit hook against staged files, so type errors silently
        # accumulated in files no commit happened to touch. Gating it here keeps
        # the whole tree type-clean, not just the diff.
        run: uv run ty check

      - name: SKILL.md freshness check
        run: |
          uv run python scripts/generate_skill.py > /dev/null 2>&1
          if ! git diff --quiet plugins/kbagent/skills/kbagent/SKILL.md; then
            echo "::error::SKILL.md is out-of-date. Run 'make skill-gen' and commit."
            git diff plugins/kbagent/skills/kbagent/SKILL.md
            exit 1
          fi

      - name: Version consistency check
        run: |
          uv run python scripts/sync_version.py > /dev/null 2>&1
          if ! git diff --quiet plugins/kbagent/.claude-plugin/plugin.json; then
            echo "::error::plugin.json version mismatch with pyproject.toml. Run 'make version-sync' and commit."
            git diff plugins/kbagent/.claude-plugin/plugin.json
            exit 1
          fi

      - name: Command-sync silent-drift check
        # Verifies every CLI command is registered in permissions.py
        # OPERATION_REGISTRY and documented across the agent-facing surfaces
        # (AGENT_CONTEXT, CLAUDE.md, commands-reference.md), with no dead
        # registry keys. None of these have any other CI coverage (see
        # CONTRIBUTING.md "Plugin synchronization map") -- forgetting one
        # ships an AI agent that recommends commands the installed kbagent
        # version does not have. (The server/routers REST mirror needs
        # judgement, so it's left to /kbagent:review, not gated here.)
        run: uv run python scripts/check_command_sync.py

      - name: Serve endpoint reference freshness check
        # docs/web-server-endpoints.md is generated from create_app().openapi().
        # The hand-maintained table it replaced drifted to claiming "150+
        # endpoints" over 17 rows while the app served 226 operations across 29
        # routers, with ten routers undocumented entirely (issue #656) -- no
        # OpenAPI spec is committed, so only a running server showed the truth
        # and nothing in CI could notice. Adding a route now fails here until
        # the reference is regenerated.
        #
        # Two conditions: `git diff --quiet` reports nothing for an UNTRACKED
        # path (a doc dropped from the index would pass while documenting
        # nothing), so tracking is asserted separately rather than by switching
        # to `git status --porcelain` -- that flags a staged-new file whose
        # content is correct, which is the normal state of the PR adding one.
        run: |
          if ! git ls-files --error-unmatch docs/web-server-endpoints.md > /dev/null 2>&1; then
            echo "::error::docs/web-server-endpoints.md is untracked -- the endpoint reference must be committed."
            exit 1
          fi
          # `--extra server` even though the install step already synced it:
          # `uv run` re-resolves per invocation, so naming the extra here is
          # what actually guarantees fastapi is importable, and it keeps this
          # identical to `make endpoints-check`. stdout is dropped but stderr
          # is NOT -- the step already fails on a crash (`bash -e`), and
          # swallowing the traceback would leave no way to see why.
          uv run --extra server python scripts/gen_endpoint_reference.py > /dev/null
          if ! git diff --quiet docs/web-server-endpoints.md; then
            echo "::error::docs/web-server-endpoints.md is out-of-date. Run 'make endpoints-gen' and commit."
            git diff docs/web-server-endpoints.md
            exit 1
          fi

      - name: Version-gate silent-drift check
        # Every `(since vX.Y.Z)` / `X.Y.Z+` marker must name a version that has
        # a CHANGELOG entry. `keboola-expert.md` turns these markers into a hard
        # refusal rule, so one naming a version that never shipped makes the
        # agent refuse a flag the user actually has -- and nothing else notices.
        # Whether a marker names the RIGHT version still needs judgement and
        # stays with /kbagent:review; that the version EXISTS does not, and a
        # release renumber breaks exactly that half in bulk. Offline (reads the
        # tree only), unlike changelog-check.
        run: uv run python scripts/check_version_gates.py

      - name: Unresolved vNEXT placeholder check (release PRs only)
        # A feature PR tags new behavior `(since vNEXT)` because it cannot know
        # its release version; the release PR rewrites every one. Miss one and
        # the plugin -- served to agents from the repo -- carries a gate no
        # installed version can satisfy, so the agent refuses a command the
        # user has. That rewrite was checklist-only, and its grep could never
        # come back empty (the process docs must mention the placeholder they
        # describe); the script separates the two by backticks instead.
        #
        # Armed only for a PR that RAISES the version. A two-dot diff is used
        # deliberately -- a shallow checkout has no merge base -- and the
        # script's PEP 440 comparison is what keeps a stale branch behind a
        # released main from being mistaken for a release PR.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          base=$(git show "origin/$GITHUB_BASE_REF:pyproject.toml" 2>/dev/null \
                 | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "base branch version: ${base:-<unreadable>}"
          if [ -z "$base" ]; then
            # Deliberately fail-open (an unreadable base must never block an
            # ordinary PR), but LOUDLY: on a release PR this would mean the
            # placeholder gate silently never armed. Verified live on PR #670
            # that the fetch above populates the ref under the default shallow
            # checkout, so reaching this line means something changed.
            echo "::warning title=vNEXT gate disarmed::could not read pyproject version from origin/$GITHUB_BASE_REF; the unresolved-placeholder check will not arm. If this is a release PR, run 'make vnext-check' locally."
          fi
          uv run python scripts/check_version_gates.py --release-if-newer-than "$base"

      - name: Error-code enum check
        # Rejects raw error_code="LITERAL" string literals (must use ErrorCode).
        run: uv run python scripts/check_error_codes.py

      - name: File-size budget check
        # Enforces the CONTRIBUTING.md per-layer budgets in CODE LINES
        # (docstrings/comments excluded, so documenting a module is free).
        # Files already over their hard ceiling are grandfathered in
        # scripts/file_size_baseline.json and may only shrink -- this catches
        # NEW oversized modules and growth of the existing ones, which review
        # reliably misses because a diff never shows the resulting file size.
        run: uv run python scripts/check_file_size.py

  # ────────────────────────────────────────────────────────────────────────
  # Test suite. pyproject declares `requires-python = ">=3.12"`, so the
  # supported interpreters are 3.12 + 3.13 (3.10/3.11 are intentionally out of
  # scope). `integration` tests are deselected; `e2e` tests self-skip without
  # credentials (the dedicated e2e.yml workflow runs them nightly against a
  # real project).
  #
  # WHICH interpreters run depends on the event:
  #   * pull_request -> 3.12 only (the floor, and what the wheel is built on)
  #   * push to main -> 3.12 + 3.13
  # A 3.13-only regression is therefore caught on main rather than on the PR.
  # That is an accepted trade: the two interpreters differ in nothing this
  # codebase touches, a PR-time 3.13 job cost ~8 billed minutes of the ~39 a PR
  # used to spend, and main runs unattended anyway. If 3.13 ever starts
  # diverging in practice, put it back in the PR matrix -- that is a one-word
  # change to the expression below.
  #
  # Coverage is INFORMATIONAL -- no --cov-fail-under threshold is enforced, so
  # it can never block a merge. It also costs ~50% extra wall clock (measured:
  # 152s -> 230s sequentially), so it is collected on main pushes only. Locally
  # it stays one `make test-cov` away.
  # ────────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel 3.12 just because 3.13 tripped (or vice versa) -- we want
      # to see which interpreters pass on a given run, not just the first failure.
      fail-fast: false
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.12", "3.13"]') }}
    env:
      # Pin uv's interpreter to the matrix version for BOTH `sync` and `run`,
      # so the suite is actually exercised on each interpreter instead of
      # whatever uv would resolve from requires-python on its own.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra server

      # `-n auto` fans the ~6k tests across the runner's cores (4 on a standard
      # GitHub-hosted runner). Every HTTP call in this suite is mocked and the
      # tests hold no shared mutable state, so it parallelises cleanly --
      # measured locally at 152s -> 37s on 4 workers, byte-identical results
      # over repeated runs. `-v` is dropped: under xdist it interleaves 6k
      # lines from four workers into unreadable output, and a failure prints
      # its own node id anyway.
      - name: Tests
        if: github.event_name != 'push'
        run: uv run pytest tests/ -m "not integration" -n auto

      # Same run, plus the informational coverage report. pytest-cov combines
      # the per-worker data files automatically, so the totals match a
      # sequential run exactly (verified: 31296/5405/9186/1121, 80%).
      - name: Tests (with coverage report)
        if: github.event_name == 'push'
        run: uv run pytest tests/ -m "not integration" -n auto --cov --cov-report=term-missing

  # Real wheel build and focused export regression on Windows -- the only
  # place the issue #320 and #529 fixes can be verified against real Windows
  # behavior without a Windows developer machine. GitHub provides
  # windows-latest runners (with Node/npm preinstalled) for free, so the
  # `npm.cmd` invocation (Bug 1) and the force-include path resolution (Bug 2)
  # are exercised against a real `uv build` rather than mocks.
  build-windows:
    name: Windows wheel build, export and self-update regressions (issues #320, #529, #528)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          # Pin an exact version so setup-uv downloads the release asset
          # directly instead of fetching the `uv.ndjson` version manifest from
          # raw.githubusercontent.com on every run -- that fetch is rate-limited
          # and flaky on shared CI egress IPs (it killed the Windows job once).
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          # v6 can auto-enable package-manager caching when a package.json
          # declares `packageManager`; the SPA is built from web/frontend/, so
          # keep the v4 behaviour (no implicit cache) explicit and predictable.
          package-manager-cache: false

      # Bug 1: with npm present, the hook must resolve `npm.cmd` via
      # shutil.which and run it (shell=False) instead of crashing with
      # `FileNotFoundError [WinError 2]`, and the SPA must land in the wheel.
      - name: Build wheel WITH bundled UI
        run: uv build --wheel

      # The whole suite, as a gate. It never ran here before: a real run was 55
      # failures, and nobody can gate on that, so nothing did -- which let real
      # Windows defects sit in the noise for entire releases. Two of them did:
      # the WinError 5 above, and a manifest written with backslash paths into
      # a git-tracked file (#576), which broke every POSIX teammate.
      #
      # The 55 were test portability, not product bugs, and are now expressed
      # as explicit POSIX-only skips (mode bits are not Windows access control;
      # fcntl does not exist there). Keeping this green is the point: a red
      # suite nobody can act on is worse than no suite, because it reads as
      # coverage while hiding things.
      # The specific regressions this job exists to hold down are all inside the
      # suite below, and used to ALSO run as three separate named steps before
      # it (`-k export` for #529, test_update_runner.py for #528,
      # test_job_idempotency_store.py for #427). Those were strict subsets of
      # this run -- duplicated Windows minutes, billed at 2x -- so they are
      # gone. What they covered has not changed:
      #   * #529: Windows has no os.O_NOFOLLOW, so semantic-layer export must
      #           prove its portable flags on the real platform.
      #   * #528: the deferred self-update helper is a PowerShell script
      #           authored on machines that cannot run it; here it really
      #           executes, with a real detached spawn, and must install
      #           NOTHING while a watched process is still alive.
      #   * #427: os.replace() cannot rename over a file Windows still holds
      #           open, so lock-then-atomic-replace stores die with WinError 5
      #           on every write while passing everywhere on POSIX. That
      #           shipped once -- `job run --idempotency-key` was unusable on
      #           Windows for a full release.
      # A failure now names the test node id instead of the step, which is the
      # same information.
      #
      # The full suite imports the `serve` tests, so it needs the same extras
      # the Linux job installs. Without this the gate fails on
      # `ModuleNotFoundError: No module named 'fastapi'` -- an artefact of the
      # job's own setup rather than anything about Windows.
      - name: Install server extras for the full run
        run: uv sync --extra server

      # `-n auto`, same as the Linux jobs: this step was 477s of the job's 568s,
      # and Windows minutes bill at 2x, so it was the single most expensive
      # thing in the whole PR pipeline.
      #
      # Read a Windows-only flake here carefully before blaming xdist. The
      # first run of this change surfaced exactly one failure, and it was a
      # test asserting a 250ms wall-clock margin (test_auth_pkce), not a
      # parallelism-safety bug -- four busy workers just made the stall that
      # the margin never tolerated actually happen. That test was widened;
      # check for the same shape first.
      #
      # If something genuinely does turn out to be parallel-unsafe, drop back
      # to sequential by replacing `-n auto` with `-p no:xdist` -- do NOT
      # disable the suite. Windows-only file-locking and atomic-replace semantics are
      # exactly what it is here to catch, and parallel workers touching the
      # same tmp paths are the plausible failure mode. The Linux jobs are
      # unaffected either way.
      - name: Full test suite on Windows
        run: >
          uv run pytest tests/
          --ignore=tests/test_e2e.py
          --ignore=tests/test_e2e_auth.py
          --ignore=tests/test_server_semantic_layer_routes_e2e.py
          -n auto
          -q

      - name: Assert the SPA is bundled (Bug 1 fixed)
        run: python scripts/check_wheel_ui.py --expect-ui

      - name: Install the built wheel and smoke-test the CLI on Windows
        shell: pwsh
        run: |
          $whl = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --no-project --with "$whl" kbagent --help

      # Bug 2: with the SPA bundle skipped, the force-include must still
      # resolve (empty `_ui_dist/`) and the wheel must build successfully.
      - name: Build CLI-only wheel WITHOUT UI
        shell: pwsh
        env:
          KBAGENT_SKIP_UI_BUILD: "1"
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          uv build --wheel

      - name: Assert CLI-only wheel built without the SPA (Bug 2 fixed)
        run: python scripts/check_wheel_ui.py --no-ui
