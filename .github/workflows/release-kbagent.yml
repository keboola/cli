# Release & distribution pipeline for kbagent — see docs/adr/0003-release-distribution-cicd.md
#
# Ships a SELF-CONTAINED NATIVE BINARY (no Python / no uv at the user's end), packaged
# for brew / apt / dnf / chocolatey / winget — the same UX the legacy Go `kbc`
# delivered. The Python app is frozen with PyInstaller (proven: `env -i kbagent
# --version` works), then packaged with nfpm (deb/rpm) and wrapped for Homebrew /
# Chocolatey / WinGet. GoReleaser is NOT used (it builds Go); nothing depends on the
# deprecated keboola-as-code repo.
#
# Steps are REAL, not stubbed. Jobs that push to external repos/S3 run under the
# protected `release` environment and need its secrets; the freeze + nfpm + GitHub
# Release jobs produce installable artifacts on their own.
name: release-kbagent

on:
  push:
    tags: ["v*.*.*"]
  # Manual dispatch is a DRY RUN only: it freezes + signs + packages so the build and
  # the signing creds get exercised, but every external-publish job (PyPI, S3 repo,
  # Homebrew, Chocolatey, WinGet, GitHub Release) is gated on `refs/tags/*`, so a
  # dispatch from an arbitrary ref can never ship an untagged build. Real publishing
  # happens only on a pushed `v*.*.*` tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build for a DRY RUN (PEP 440, e.g. 0.43.0b1 / 0.58.0). Freezes + signs + packages only; external publishing happens exclusively on a pushed v*.*.* tag."
        required: true

env:
  PKG_NAME: keboola-cli2
  BIN_NAME: kbagent
  BASE_URL: https://cli-dist.keboola.com
  S3_PREFIX: keboola-cli2
  AWS_BUCKET_NAME: cli-dist-keboola-com
  AWS_REGION: us-east-1
  # Pin the interpreter uv uses across all jobs for reproducible release builds
  # (project requires-python >=3.12; CI gates on 3.12).
  UV_PYTHON: "3.12"
  # Apple notarization identifiers — public (not secret); kept here so rotating the
  # account/team is a one-line change rather than editing the freeze step's env. The
  # macOS sign step inherits these; the actual secrets stay in that step.
  APPLE_ACCOUNT_USERNAME: apple@keboola.com
  APPLE_TEAM_ID: "46P6KJ65M2"

# Least-privilege default: every job is read-only unless it overrides this with the
# narrower scope it actually needs (see the per-job `permissions:` below). Only three
# jobs get an elevated token — pypi + publish-s3 (id-token for OIDC) and github-release
# (contents: write to create the Release). version/gate/freeze/package-linux/homebrew/
# chocolatey/winget/test-install all stay read-only.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.v.outputs.VERSION }}
      # "true" for a pre-release tag (has a -suffix, e.g. v0.0.1-dev.1). Pre-releases
      # build + package + sign, publish to S3 under the dev prefix (PUBLISH_PREFIX), and
      # run test-install + a GitHub pre-release. The user-facing publishers (PyPI,
      # Homebrew, Chocolatey, WinGet) are skipped — only real tags reach those.
      IS_PRERELEASE: ${{ steps.v.outputs.IS_PRERELEASE }}
      # S3 prefix to publish under: prod (`keboola-cli2`) for real releases, a separate
      # `keboola-cli2-dev` for pre-releases so a dev tag can exercise the full S3 publish
      # + client install test without touching the prod apt/rpm repos.
      PUBLISH_PREFIX: ${{ steps.v.outputs.PUBLISH_PREFIX }}
    steps:
      - id: v
        env:
          REF: ${{ github.ref_name }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          RAW="${INPUT:-$REF}"
          # PEP 440 (the repo's convention, see CONTRIBUTING.md): X.Y.Z, X.Y.Z{a,b,rc}N,
          # X.Y.Z.devN/.postN — plus the SemVer -suffix.N form for dev tags.
          VERSION=$(printf '%s' "$RAW" | sed -n -E 's:^v?([0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+|\.post[0-9]+|-[a-z]+\.[0-9]+)?)$:\1:p')
          [ -z "$VERSION" ] && { echo "not a PEP 440 / semver version: $RAW"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          # Pre-release = any a/b/rc/.dev/-suffix marker (.post is a real release).
          if printf '%s' "$VERSION" | grep -Eq '(a|b|rc)[0-9]+$|\.dev[0-9]+$|-'; then PRE=true; else PRE=false; fi
          echo "IS_PRERELEASE=$PRE" >> "$GITHUB_OUTPUT"
          # Pre-releases publish to a separate dev prefix (see PUBLISH_PREFIX output above).
          if [ "$PRE" = true ]; then PUBLISH_PREFIX="${S3_PREFIX}-dev"; else PUBLISH_PREFIX="${S3_PREFIX}"; fi
          echo "PUBLISH_PREFIX=$PUBLISH_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION prerelease=$PRE prefix=$PUBLISH_PREFIX"

  # Reuse the per-PR gates against the tagged commit, plus changelog-check.
  gate:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Fail before any publish if the tag/input version drifts from pyproject.toml —
      # otherwise we'd ship artifacts labelled vX.Y.Z that self-report a different
      # version, and only test-install (which greps for the tag) would catch it later.
      - name: Tag matches pyproject version
        env:
          VERSION: ${{ needs.version.outputs.VERSION }}
        run: |
          PY=$(sed -n -E 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)
          [ "$PY" = "$VERSION" ] || { echo "::error::tag v$VERSION does not match pyproject version $PY"; exit 1; }
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.11.16" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: uv sync --extra server
      - run: uv run ruff check src/ tests/ scripts/
      - run: uv run ruff format . --check
      - run: uv run ty check
      - run: uv run pytest tests/ -m "not integration and not e2e" -q
      # Same silent-drift gates ci.yml enforces, so a tag pushed directly can't bypass them.
      - run: uv run python scripts/check_command_sync.py
      - run: uv run python scripts/check_error_codes.py
      # A renumbered release is exactly the mistake that reaches a TAG rather
      # than a PR, so this gate matters more here than in ci.yml: the markers
      # break in bulk the moment the version they name stops shipping.
      - run: uv run python scripts/check_version_gates.py
      - name: SKILL.md + version drift
        run: |
          uv run python scripts/generate_skill.py > /dev/null 2>&1
          uv run python scripts/sync_version.py > /dev/null 2>&1
          git diff --exit-code plugins/kbagent/skills/kbagent/SKILL.md plugins/kbagent/.claude-plugin/plugin.json .claude-plugin/marketplace.json uv.lock
      - name: changelog-check (skipped on pre-releases)
        if: needs.version.outputs.IS_PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}  # gh release list needs auth; contents:read is enough scope
        run: uv run python scripts/generate_changelog.py --check
      # Render the GitHub Release body from changelog.py so the release page can
      # never disagree with `kbagent changelog` (v0.66.1 shipped with an EMPTY
      # body: nobody pre-created the release by hand and the github-release job
      # creates it bare). Runs here because gate already has the uv env; the file
      # travels to github-release as an artifact. This is also the FORWARD gate:
      # a stable tag whose version has no CHANGELOG entry fails the release now,
      # before anything publishes (generate_changelog.py --check above only
      # audits already-published releases). The full released-version list goes
      # to the script, which walks the changelog from the tagged version toward
      # older entries until it hits one that is already released — versions that
      # were merged but never tagged ship in the next tag as one catch-up
      # section per version, with no reliance on `gh release list` ordering (an
      # old-line hotfix tagged after a newer release still gets exactly its own
      # section).
      - name: Generate release notes from changelog.py
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.VERSION }}
          IS_PRERELEASE: ${{ needs.version.outputs.IS_PRERELEASE }}
        run: |
          args=(--version "$VERSION" --output release-notes.md)
          for tag in $(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
            args+=(--released "${tag#v}")
          done
          if [ "$IS_PRERELEASE" = "true" ]; then args+=(--allow-missing); fi
          uv run python scripts/gen_release_notes.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          # A pre-release without a changelog entry generates nothing (see
          # --allow-missing); the fill step downstream warns and moves on.
          if-no-files-found: ignore

  # ── Build the prebuilt wheel and publish to PyPI (for the `uv`/`pipx` audience).
  #    This is ADDITIONAL to the native binary, not the primary install path.
  pypi:
    needs: [version, gate]
    if: needs.version.outputs.IS_PRERELEASE == 'false' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # actions/checkout
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-build
      - run: uv build
      - run: uv run python scripts/check_wheel_ui.py --expect-ui
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: a re-tag / re-run after a downstream (signing) failure
          # must not fail just because this version is already on PyPI.
          skip-existing: true

  # ── Freeze a self-contained native binary per OS/arch (PyInstaller).
  freeze:
    needs: [version, gate]
    strategy:
      fail-fast: false
      matrix:
        # `platform` is the OS name baked into artifact/zip filenames (darwin/linux/
        # windows) — Homebrew/Chocolatey/WinGet URLs depend on these exact values.
        #
        # Linux legs are PINNED to the OLDEST GA runner, NOT ubuntu-latest: a
        # PyInstaller binary requires the build machine's glibc (or newer) at
        # runtime, so the build runner sets the compatibility floor for every
        # end user. ubuntu-latest (24.04, glibc 2.39) produced a v0.71.0 binary
        # that failed with "GLIBC_2.38 not found" on Ubuntu 22.04-era systems
        # (caught by test-install's Homebrew leg, run 29752342509). Building on
        # ubuntu-22.04 (glibc 2.35) keeps Ubuntu 22.04 / Debian 12 installable.
        # Bump these only when the OS baseline is consciously dropped — never
        # back to -latest.
        include:
          - { os: ubuntu-22.04, platform: linux, arch: amd64 }
          - { os: ubuntu-22.04-arm, platform: linux, arch: arm64 }
          # Single macOS environment (Apple Silicon). PyInstaller can't cross-compile,
          # so there's no Intel leg; Intel Macs use `uv tool install`. Re-add a
          # `{ os: macos-13, platform: darwin, arch: amd64 }` entry if native Intel is needed.
          - { os: macos-latest, platform: darwin, arch: arm64 }
          - { os: windows-latest, platform: windows, arch: amd64 }
    runs-on: ${{ matrix.os }}
    environment: release # so APPLE_*/WINDOWS_* signing secrets resolve
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-build

      # Populate src/keboola_agent_cli/_ui_dist via the hatch build hook (needs Node),
      # so `kbagent serve --ui` works from the frozen binary. `uv build` runs the hook.
      - name: Build SPA into the package (for serve --ui)
        run: uv build --wheel

      - name: Freeze with PyInstaller
        shell: bash
        run: |
          uv run --with "pyinstaller==6.11.1" pyinstaller --onefile \
            --name "$BIN_NAME" \
            --collect-all keboola_agent_cli \
            --distpath dist \
            build/package/entry.py

      # macOS: sign + notarize. On a pre-release tag this runs as a NON-FATAL
      # signature check (continue-on-error) so a dev tag verifies the Apple creds
      # without blocking the build; on a real tag it is required.
      - name: Sign & notarize (macOS)
        if: ${{ matrix.platform == 'darwin' }}
        continue-on-error: ${{ needs.version.outputs.IS_PRERELEASE == 'true' }}
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_ACCOUNT_PASSWORD: ${{ secrets.APPLE_ACCOUNT_PASSWORD }}
          # APPLE_ACCOUNT_USERNAME / APPLE_TEAM_ID inherited from the workflow-level env.
        run: bash build/package/macos/sign_notarize.sh "dist/$BIN_NAME"

      # Windows: Authenticode sign the .exe. Non-fatal on pre-release (signature
      # check only); required on a real tag.
      - name: Sign (Windows, Azure Key Vault)
        if: ${{ matrix.platform == 'windows' }}
        continue-on-error: ${{ needs.version.outputs.IS_PRERELEASE == 'true' }}
        shell: bash
        env:
          WINDOWS_SIGNING_TENANT_ID: ${{ secrets.WINDOWS_SIGNING_TENANT_ID }}
          WINDOWS_SIGNING_CLIENT_ID: ${{ secrets.WINDOWS_SIGNING_CLIENT_ID }}
          WINDOWS_SIGNING_CLIENT_SECRET: ${{ secrets.WINDOWS_SIGNING_CLIENT_SECRET }}
        run: bash build/package/windows/sign.sh "dist/${BIN_NAME}.exe"

      - name: Zip the binary
        shell: bash
        run: bash build/package/zip_binary.sh "$PKG_NAME" "$VERSION" "${{ matrix.platform }}" "${{ matrix.arch }}" "$BIN_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/${{ env.BIN_NAME }}*

  # ── Package the Linux binaries into deb/rpm with nfpm (language-agnostic).
  package-linux:
    needs: [version, freeze]
    runs-on: ubuntu-latest
    environment: release # so DEB/RPM signing keys resolve
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v5
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb" -o /tmp/nfpm.deb
          echo "0a188f8bcf4ba4ba6414a514bc1f1d59f5cc92ba86160462d7aa7dab5930d327  /tmp/nfpm.deb" | sha256sum -c -
          sudo dpkg -i /tmp/nfpm.deb
      - uses: actions/download-artifact@v4
        with: { pattern: bin-linux-*, path: artifacts }
      - name: Write package signing keys
        env:
          # DEB/RPM are signed with GPG keys.
          DEB_KEY_PRIVATE: ${{ secrets.DEB_KEY_PRIVATE }}
          RPM_KEY_PRIVATE: ${{ secrets.RPM_KEY_PRIVATE }}
        run: |
          mkdir -p /tmp/keys
          for k in DEB_KEY_PRIVATE RPM_KEY_PRIVATE; do
            [ -n "${!k}" ] || { echo "::error::$k is empty — refusing to build unsigned/garbage-signed packages"; exit 1; }
          done
          printf '%s' "$DEB_KEY_PRIVATE" > /tmp/keys/deb.key && chmod 600 /tmp/keys/deb.key
          printf '%s' "$RPM_KEY_PRIVATE" > /tmp/keys/rpm.key && chmod 600 /tmp/keys/rpm.key
      - name: Build deb/rpm for each arch
        run: bash build/package/linux/build_packages.sh "$VERSION" artifacts
      - uses: actions/upload-artifact@v4
        with: { name: linux-packages, path: dist/* }

  # ── Create the GitHub Release with every binary + package attached (directly
  #    installable: `dpkg -i keboola-cli2_*.deb`, unzip the binary, etc.).
  github-release:
    needs: [version, freeze, package-linux]
    # Only on a real tag push. A workflow_dispatch run has no tag, so creating a
    # GitHub Release for v${VERSION} would fail or fabricate an unexpected release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release creates the GitHub Release
      actions: write # dispatch release.yml (the wheel-attach workflow) below
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.sha256' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          ls -al release/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: release/*
          prerelease: ${{ needs.version.outputs.IS_PRERELEASE == 'true' }}
      # Fill the release body from the changelog-derived notes the gate job
      # rendered — but only when the body is EMPTY. softprops above creates the
      # release bare on a plain tag push (that is how v0.66.1 shipped without
      # notes); a release someone pre-created by hand keeps its hand-written
      # body untouched.
      - name: Fill release notes when the body is empty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="artifacts/release-notes/release-notes.md"
          if [ ! -f "$notes" ]; then
            echo "::warning::no release-notes artifact (pre-release without a changelog entry?); leaving the body as-is"
            exit 0
          fi
          # `.body // ""` — the API can return the body as JSON null (not ""),
          # which --jq would print as the literal string "null" and defeat the
          # emptiness test below.
          body="$(gh release view "v${VERSION}" --json body --jq '.body // ""')"
          if [ -n "$body" ]; then
            echo "release v${VERSION} already has notes (authored by hand); leaving them untouched"
            exit 0
          fi
          gh release edit "v${VERSION}" --notes-file "$notes"
          echo "filled release notes for v${VERSION} from changelog.py"
      # Attach the pip/uv wheel too. release.yml builds + uploads it (the asset that
      # auto-update and install.sh download) on `release: published`. A release this
      # job creates with GITHUB_TOKEN does NOT emit that event, so when no one
      # published the release by hand the wheel never got attached -- this broke
      # v0.64.0. workflow_dispatch is the documented exception to the GITHUB_TOKEN
      # no-trigger rule, so dispatch release.yml directly; that runs it no matter who
      # or what created the release. The release already exists (created above), so
      # the upload lands.
      - name: Attach the pip/uv wheel (dispatch release.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # required: no checkout in this job, gh can't read the repo from git
        run: gh workflow run release.yml -f tag="v${VERSION}"
      # gh workflow run is fire-and-forget: it returns once GitHub accepts the
      # dispatch, not when release.yml finishes. Poll the release for the wheel so a
      # failed release.yml turns THIS run red instead of silently shipping no wheel.
      - name: Confirm the wheel was attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 30); do
            sleep 20
            names="$(gh release view "v${VERSION}" --json assets --jq '.assets[].name')"
            if grep -qx "keboola_cli-${VERSION}-py3-none-any.whl" <<<"$names" \
               && grep -qx "keboola_agent_cli-${VERSION}-py3-none-any.whl" <<<"$names"; then
              echo "both wheels attached"; exit 0
            fi
          done
          echo "::error::wheel(s) still missing 10 min after dispatching release.yml for v${VERSION} -- check that run"
          exit 1

  # ── Publish to S3 (cli-dist.keboola.com/keboola-cli2/) and index the apt/rpm
  #    repos so `apt-get install keboola-cli2` works. Real; needs AWS + GPG secrets.
  publish-s3:
    needs: [version, freeze, package-linux]
    # Runs on every tag. Pre-releases publish under the dev prefix (PUBLISH_PREFIX), so a
    # dev tag exercises the full publish + client install test without touching prod repos.
    if: startsWith(github.ref, 'refs/tags/')
    # Serialize per prefix: the wipe + index steps mutate a shared repo prefix, so two
    # concurrent tag runs (e.g. two dev tags) could delete/overwrite each other mid-publish.
    # Queue (don't cancel) so an in-flight publish always finishes intact.
    concurrency:
      group: publish-s3-${{ needs.version.outputs.PUBLISH_PREFIX }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # actions/checkout
      id-token: write # AWS OIDC (configure-aws-credentials assumes the role)
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
      PUBLISH_PREFIX: ${{ needs.version.outputs.PUBLISH_PREFIX }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Wipe dev prefix (pre-release only)
        # Dev tags reuse the keboola-cli2-dev prefix; clear it so each dev run is a clean
        # slate and version resolution isn't confused by leftover packages from a prior
        # dev tag. NEVER runs for the prod prefix (guarded on the -dev suffix).
        if: needs.version.outputs.IS_PRERELEASE == 'true'
        run: |
          case "$PUBLISH_PREFIX" in
            *-dev) aws s3 rm --recursive "s3://${AWS_BUCKET_NAME}/${PUBLISH_PREFIX}/" || true ;;
            *) echo "refusing to wipe non-dev prefix '$PUBLISH_PREFIX'"; exit 1 ;;
          esac
      - name: Upload versioned assets
        run: |
          mkdir -p up && find artifacts -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.sha256' \) -exec cp {} up/ \;
          aws s3 sync up/ "s3://${AWS_BUCKET_NAME}/${PUBLISH_PREFIX}/v${VERSION}/"
      - name: Index apt/rpm repos (signed)
        env:
          # No DEB_KEY_PUBLIC: the apt keyring is derived (dearmored) from DEB_KEY_PRIVATE.
          DEB_KEY_PRIVATE: ${{ secrets.DEB_KEY_PRIVATE }}
          RPM_KEY_PUBLIC: ${{ secrets.RPM_KEY_PUBLIC }}
        run: bash build/package/linux/index.sh "${AWS_BUCKET_NAME}" "${PUBLISH_PREFIX}"

  # ── Homebrew: render the formula from the template and push to the kbagent-owned tap.
  homebrew:
    needs: [version, freeze, publish-s3]
    if: needs.version.outputs.IS_PRERELEASE == 'false' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Render formula
        run: |
          mkdir -p out/Formula
          bash build/package/homebrew/render.sh "$VERSION" artifacts > out/Formula/keboola-cli2.rb
      - name: Push to tap keboola/homebrew-keboola-cli2
        # SHA-pinned (not a mutable tag): this action receives HOMEBREW_TAP_TOKEN, a
        # write-scoped PAT to the tap repo, so a re-pointed tag would be a supply-chain
        # foothold. Bump the SHA and the trailing version comment together on upgrade.
        uses: cpina/github-action-push-to-another-repository@07c4d7b3def0a8ebe788a8f2c843a4e1de4f6900 # v1.7.2
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        with:
          # Copy the rendered formula into the tap's `Formula/` dir (its canonical
          # location) rather than the repo root. target-directory "." made the
          # push action run `rm` against `.`/`..` while clearing the target, which
          # fails fatally ("can't remove '.' or '..'"); a real subdirectory clears
          # cleanly. The resulting tap layout (`Formula/keboola-cli2.rb`) is unchanged.
          source-directory: "out/Formula"
          target-directory: "Formula"
          destination-github-username: keboola
          destination-repository-name: homebrew-keboola-cli2
          target-branch: main

  # ── Chocolatey: wrap the signed Windows .exe and push.
  chocolatey:
    needs: [version, freeze, publish-s3]
    if: needs.version.outputs.IS_PRERELEASE == 'false' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v5
      - name: Pack & push
        shell: pwsh
        env:
          CHOCOLATEY_KEY: ${{ secrets.CHOCOLATEY_KEY }}
        run: |
          $url = "$env:BASE_URL/$env:S3_PREFIX/v$env:VERSION/keboola-cli2_${env:VERSION}_windows_amd64.zip"
          # The .sha256 asset is served as application/octet-stream, so pwsh returns
          # Invoke-WebRequest's .Content as a byte[] (no .Split method -> the job failed
          # with "[System.Byte] does not contain a method named 'Split'"). Download it to
          # a file and read it back as text, splitting on any whitespace ("<hash>  <file>").
          Invoke-WebRequest "$url.sha256" -OutFile checksum.txt
          $checksum = ((Get-Content checksum.txt -Raw).Trim() -split '\s+')[0]
          $push = "build/package/chocolatey"
          (Get-Content "$push/keboola-cli2.nuspec" -Raw).Replace('{VERSION}', $env:VERSION) | Set-Content "$push/keboola-cli2.nuspec"
          (Get-Content "$push/tools/chocolateyinstall.ps1" -Raw).Replace('{URL}', $url).Replace('{CHECKSUM}', $checksum) | Set-Content "$push/tools/chocolateyinstall.ps1"
          cd $push
          choco pack keboola-cli2.nuspec
          choco apikey -k $env:CHOCOLATEY_KEY -s https://push.chocolatey.org/
          choco push "keboola-cli2.$env:VERSION.nupkg" -s https://push.chocolatey.org

  # ── WinGet: submit a PR to microsoft/winget-pkgs via wingetcreate.
  #
  # DISABLED (if: false): `wingetcreate update` fails on every tag because the
  # `Keboola.KeboolaCLI2` package has never had its FIRST submission to
  # microsoft/winget-pkgs -- there is no manifest to update, so the job has been
  # red on every release since it was added, masking real failures. Re-enable by
  # restoring the original condition (kept below) AFTER the bootstrap submission
  # lands; see the NOTE in the first step for what that submission must contain.
  winget:
    needs: [version, chocolatey, publish-s3]
    # Original condition, restore when re-enabling:
    #   needs.version.outputs.IS_PRERELEASE == 'false' && startsWith(github.ref, 'refs/tags/')
    if: false
    runs-on: windows-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
    steps:
      # NOTE for whoever gets this job working: `wingetcreate update` only bumps
      # the version and installer URL -- it does NOT write locale fields. The
      # FIRST successful submission must therefore set `License: Apache-2.0`
      # itself, because every later run inherits whatever that manifest said.
      # Do not copy the existing `Keboola.KeboolaCLI` manifest: that is the
      # legacy Go CLI from keboola/keboola-as-code, a different product under a
      # different (MIT) licence. `Keboola.KeboolaCLI2` has never been submitted.
      - name: Submit to winget-pkgs
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          url="${BASE_URL}/${S3_PREFIX}/v${VERSION}/keboola-cli2_${VERSION}_windows_amd64.zip"
          curl -fLSs https://aka.ms/wingetcreate/latest -o wingetcreate.exe
          # Verify it's validly Authenticode-signed by Microsoft before executing.
          powershell -Command '$s = Get-AuthenticodeSignature wingetcreate.exe; if ($s.Status -ne "Valid" -or $s.SignerCertificate.Subject -notmatch "Microsoft") { Write-Error "wingetcreate.exe signature not valid/Microsoft: $($s.Status)"; exit 1 }'
          ./wingetcreate.exe update -v "$VERSION" -u "$url" -t "$WINGET_TOKEN" Keboola.KeboolaCLI2 -s

  # ── Smoke-test the real install paths end to end. Runs on every tag (incl. dev tags,
  #    against PUBLISH_PREFIX); the Homebrew leg is prod-only since the tap isn't pushed
  #    for pre-releases. always() so it still runs when homebrew is skipped on a dev tag.
  test-install:
    needs: [version, publish-s3, homebrew]
    if: always() && needs.publish-s3.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.VERSION }}
      PREFIX: ${{ needs.version.outputs.PUBLISH_PREFIX }}
    steps:
      - name: apt (Ubuntu)
        run: |
          docker run --rm -e PREFIX -e VERSION ubuntu bash -c '
            set -eo pipefail
            apt-get update -y && apt-get install -y wget ca-certificates gnupg
            wget -P /etc/apt/trusted.gpg.d "https://cli-dist.keboola.com/${PREFIX}/deb/keboola.gpg"
            echo "deb https://cli-dist.keboola.com/${PREFIX}/deb /" > /etc/apt/sources.list.d/keboola.list
            apt-get update && apt-get install -y keboola-cli2
            kbagent --version | grep -q "${VERSION}"
          '
      - name: rpm (Fedora)
        if: ${{ !cancelled() }}   # run even if an earlier leg failed, so one run shows all results
        run: |
          docker run --rm -e PREFIX -e VERSION fedora bash -c '
            set -eo pipefail
            rpm --import "https://cli-dist.keboola.com/${PREFIX}/rpm/keboola.gpg"
            printf "%s\n" "[keboola]" "name=keboola" \
              "baseurl=https://cli-dist.keboola.com/${PREFIX}/rpm" \
              "enabled=1" "gpgcheck=1" \
              "gpgkey=https://cli-dist.keboola.com/${PREFIX}/rpm/keboola.gpg" \
              > /etc/yum.repos.d/keboola.repo
            dnf install -y keboola-cli2
            kbagent --version | grep -q "${VERSION}"
          '
      - name: Homebrew (Linux)
        if: ${{ !cancelled() && needs.version.outputs.IS_PRERELEASE == 'false' && needs.homebrew.result == 'success' }}
        run: |
          docker run --rm -e VERSION homebrew/brew bash -c '
            set -e
            brew tap keboola/keboola-cli2 https://github.com/keboola/homebrew-keboola-cli2
            # brew now refuses to load a formula from a third-party tap until the tap is
            # explicitly trusted ("Refusing to load formula ... from untrusted tap ...").
            # First observed on the v0.66.1 run (github.com/keboola/cli, release-kbagent
            # #29430278032) -- this is a real end-user install step too, not CI-only.
            brew trust keboola/keboola-cli2
            brew install keboola-cli2
            kbagent --version | grep -q "${VERSION}"
          '
