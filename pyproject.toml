[project]
name = "keboola-cli"
version = "0.91.0"
description = "AI-friendly CLI for managing Keboola projects"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Keboola", email = "dev@keboola.com" },
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2.5",
    "platformdirs>=4",
    "jsonschema>=4.20",
    "pyyaml>=6",
    "packaging>=23",
    "prompt-toolkit>=3.0",
    "kai-client>=0.11.0",
    "croniter>=2.0",
    "cryptography>=48.0.1",
    "filelock>=3.13",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.31",
]

[project.scripts]
kbagent = "keboola_agent_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keboola_agent_cli"]
# The CustomBuildHook below populates ``src/keboola_agent_cli/_ui_dist/``
# (gitignored) right before wheel collection, so the React SPA ships
# inside the installed package and ``kbagent serve --ui`` works after
# ``uv tool install git+...`` or ``pip install`` from PyPI without the
# user needing the ``web/`` source tree.
#
# ``force-include`` (below) is meant to be the ONLY way ``_ui_dist/`` enters
# the wheel. Without this ``exclude``, the ``packages`` collection above picks
# the dir up as well and the build aborts with "A second file is being added to
# the wheel archive at the same path".
#
# Do NOT count on hatchling's .gitignore-based exclusion to prevent that; it is
# version-dependent and it does not save this repo. Bisected on a clean
# checkout WITH both ``.git`` and ``.gitignore`` present and a prebuilt SPA on
# disk: hatchling <= 1.29.0 builds, >= 1.30.0 fails (1.30 / 1.31 / 1.32 all
# reproduce), and ``requires = ["hatchling"]`` above is unpinned, so every
# build takes the latest. Whether that exclusion fires at all also depends on
# where the ``.gitignore`` sits relative to the project root and the ``.git``
# boundary hatchling stops its upward search at -- an ancestor ``.gitignore``
# suppressed the duplicate in a minimal fixture, this repo's own root
# ``.gitignore`` does not.
#
# ``exclude`` is a plain glob, evaluated unconditionally, so it holds across
# both VCS state and hatchling version: verified shipping exactly one
# ``_ui_dist/index.html`` on hatchling 1.27, 1.29, 1.30 and 1.32.
exclude = ["src/keboola_agent_cli/_ui_dist"]

[tool.hatch.build.targets.wheel.force-include]
"src/keboola_agent_cli/_ui_dist" = "keboola_agent_cli/_ui_dist"
# PEP 561: ship the py.typed marker so downstream type checkers treat the
# importable SDK (Client + result_models contracts, issue #428) as typed.
# Forced in explicitly rather than relying on hatchling's default file
# selection, so the marker is guaranteed to land in the wheel.
"src/keboola_agent_cli/py.typed" = "keboola_agent_cli/py.typed"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.sdist]
# Include the React source tree in sdist so `pip install` from sdist can
# still build the SPA via the same hook (provided npm is available).
include = [
    "src/",
    "tests/",
    "scripts/",
    "web/frontend/",
    "web/README.md",
    "Makefile",
    "README.md",
    "CONTRIBUTING.md",
    "CLAUDE.md",
    "scripts/hatch_build.py",
    "pyproject.toml",
]
exclude = [
    "web/frontend/node_modules",
    "web/frontend/dist",
    "web/frontend/tsconfig.tsbuildinfo",
    "web/backend",
    # Generated SPA output must never ship as *source*. ``include`` above has
    # ``src/``, so with a ``_ui_dist/`` already on disk (an earlier editable
    # install) and hatchling's .gitignore exclusion not applying -- as
    # unreliable here as it is for the wheel target above -- the sdist carries
    # a prebuilt SPA. Harmless downstream, since ``_bundle_ui`` rmtree's the
    # dir before every build and a stale copy can never reach a wheel, but it
    # ships bytes that are not source.
    "src/keboola_agent_cli/_ui_dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "integration: marks tests as integration tests requiring real API credentials (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests requiring real API credentials (deselect with '-m \"not e2e\"')",
    "e2e_invite: project invite E2E -- requires E2E_MANAGE_TOKEN + E2E_INVITE_PROJECT_ID; opt-in via 'make test-e2e-invite'",
    "e2e_auth: programmatic-auth (browser login) session E2E -- requires E2E_URL + E2E_SESSION_REFRESH_TOKEN + E2E_SESSION_PROJECT_ID; opt-in via 'make test-e2e-auth'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["keboola_agent_cli"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    # Parallel test execution. The suite is ~6k tests of in-process CliRunner
    # invocations with every HTTP call mocked -- CPU-bound, no shared mutable
    # state, so it scales almost linearly across workers. Sequentially it took
    # ~8.5 min per interpreter in CI (three such runs per PR, one of them on a
    # 2x-billed Windows runner) purely because nothing ever ran concurrently.
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "ty>=0.0.33",
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
]

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.ty.environment]
# tests/ import shared fixtures via bare `from helpers import ...` (pytest adds
# tests/ to sys.path at runtime); list it here so ty resolves the import too.
extra-paths = ["tests"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.coverage.run]
# Coverage is INFORMATIONAL only -- CI prints a term-missing report but does
# NOT enforce a --cov-fail-under threshold. See `make test-cov` and the `test`
# job in .github/workflows/ci.yml. Branch coverage gives a truer picture of
# the dual-output (JSON vs Rich) and error-path branches that dominate this CLI.
source = ["keboola_agent_cli"]
branch = true
