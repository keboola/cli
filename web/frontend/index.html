<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kbagent ・ NERD UI for Keboola</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Anti-FOUC theme bootstrap: read the saved preference (or system pref)
      synchronously BEFORE React mounts, so the very first paint already has
      the correct ``dark`` class on <html>. ThemeProvider then takes over and
      keeps localStorage + DOM in sync going forward.

      Resolution order (since May 2026 light-primary pivot):
        1. localStorage["kbagent.theme"] (explicit user choice — wins)
        2. OS prefers-color-scheme: dark   → use dark
        3. otherwise                       → use light (the default)
      A user with no saved preference and no dark OS pref lands in light.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("kbagent.theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          // localStorage / matchMedia blew up — fall through to the
          // default light surface (no class manipulation needed).
        }
      })();
    </script>
  </head>
  <body class="font-mono antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
